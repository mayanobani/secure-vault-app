name: Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

jobs:
  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so TruffleHog can scan past commits

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

  bandit:
    name: Python SAST (Bandit)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit against backend
        run: bandit -r backend -f screen -ll

  hadolint:
    name: Dockerfile lint (Hadolint)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  trivy:
    name: Image vulnerability scan (Trivy)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t myapp-backend:scan ./backend

      - name: Build frontend image
        run: docker build -t myapp-frontend:scan ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp-backend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'   # set to '1' once you want failing builds on findings

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp-frontend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'
